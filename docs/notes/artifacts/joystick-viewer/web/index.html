<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PICO Neo 3 · 摇杆平面与支点</title>
    <style>
      :root {
        --bg: #0e1116;
        --panel: #161b22;
        --line: #2a323d;
        --fg: #d7dee8;
        --dim: #8b97a6;
        --ok: #4cc38a;
        --warn: #e3b341;
        --axis-x: #ff8f5a;
        --axis-y: #59b0ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
        font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; overflow: hidden; }
      #app { display: flex; height: 100%; }
      #panel { width: 286px; flex: 0 0 286px; background: var(--panel); border-right: 1px solid var(--line);
        overflow-y: auto; padding: 12px 14px 28px; }
      #view { flex: 1; position: relative; background: radial-gradient(circle at 50% 42%, #1b2431 0%, #0b0e13 72%); }
      canvas { display: block; }
      h1 { font-size: 13px; margin: 2px 0 10px; letter-spacing: .02em; }
      h1 small { color: var(--dim); font-weight: 400; }
      .grp { border-top: 1px solid var(--line); padding: 10px 0 4px; }
      .grp > .t { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 7px; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 5px 0; }
      .row label { color: var(--fg); flex: 1 1 auto; }
      .row output { color: var(--ok); font-variant-numeric: tabular-nums; min-width: 60px; text-align: right; }
      input[type=range] { width: 100%; margin: 3px 0 8px; accent-color: #4c8dff; }
      .btns { display: flex; flex-wrap: wrap; gap: 6px; }
      button { background: #212936; color: var(--fg); border: 1px solid var(--line); border-radius: 5px;
        padding: 5px 9px; font: inherit; cursor: pointer; }
      button:hover { background: #2b3547; }
      button.on { background: #24405e; border-color: #3f6f9e; }
      .chk { display: flex; align-items: center; gap: 7px; margin: 6px 0; color: var(--dim); cursor: pointer; }
      .chk input { accent-color: #4c8dff; }
      #readout { font: 11px/1.65 Consolas, "Cascadia Mono", monospace; color: var(--dim);
        white-space: pre; border-top: 1px solid var(--line); margin-top: 10px; padding-top: 9px; }
      #readout b { color: var(--fg); font-weight: 600; }
      .hint { color: var(--dim); font-size: 11px; margin-top: 8px; }
      .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
      #hud { position: absolute; left: 12px; bottom: 10px; color: var(--dim); font-size: 11px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="panel">
        <h1>摇杆平面与支点 <small>· 实测</small></h1>

        <div class="grp">
          <div class="t">输入（× 倾角增益）</div>
          <div class="row"><label>推右 +X</label><output id="oInX">+0.00</output></div>
          <input id="inX" type="range" min="-1" max="1" step="0.01" value="0" />
          <div class="row"><label>推上 +Y</label><output id="oInY">+0.00</output></div>
          <input id="inY" type="range" min="-1" max="1" step="0.01" value="0" />
          <div class="row"><label>满偏倾角</label><output id="oAmp">8.0°</output></div>
          <input id="amp" type="range" min="0" max="20" step="0.5" value="8" />
        </div>

        <div class="grp">
          <div class="t">模拟推动</div>
          <div class="btns">
            <button data-push="1,0">推右 +X</button>
            <button data-push="-1,0">推左 −X</button>
            <button data-push="0,1">推上 +Y</button>
            <button data-push="0,-1">推下 −Y</button>
            <button data-push="0,0">回中</button>
          </div>
          <label class="chk"><input id="sDemo" type="checkbox" /> 绕圈自动推</label>
        </div>

        <div class="grp">
          <div class="t">支点（沿摇杆轴，平面下方）</div>
          <div class="row"><label>支点沿轴偏移</label><output id="oDep">+4.0 mm</output></div>
          <input id="dep" type="range" min="-9" max="12" step="0.1" value="4" />
          <div class="btns">
            <button data-depth="-4">−4（平面上方）</button>
            <button data-depth="0">平面处</button>
            <button data-depth="4">+4</button>
            <button data-depth="7.4">杆底</button>
          </div>
          <div class="hint" style="margin-top:2px">＋ = 平面下方（机身内），− = 平面上方</div>
          <div class="t">按下</div>
          <label class="chk"><input id="press" type="checkbox" /> 按住（沿轴）</label>
          <div class="row"><label>行程</label><output id="oPress">2.5 mm</output></div>
          <input id="pressMm" type="range" min="0" max="5" step="0.1" value="2.5" />
          <div class="hint" style="margin-top:2px">厂商原值 −2.5 mm；真机 L3 行程通常 &lt;1 mm</div>
        </div>

        <div class="grp">
          <div class="t">显示</div>
          <label class="chk"><input id="sPlane" type="checkbox" checked /> 按键平面</label>
          <label class="chk"><input id="sAxes" type="checkbox" checked /> 平面内两条转轴</label>
          <label class="chk"><input id="sPivot" type="checkbox" checked /> 支点与杆轴</label>
          <label class="chk"><input id="sClip" type="checkbox" /> 剖开机身</label>
          <label class="chk"><input id="sRing" type="checkbox" /> 切掉跟踪环</label>
          <label class="chk"><input id="sBounds" type="checkbox" /> 模型原点 + 包围盒</label>
          <label class="chk"><input id="sGrid" type="checkbox" /> z=0 点线网格</label>
          <label class="chk"><input id="sMirror" type="checkbox" /> 镜像（右手）</label>
          <label class="chk"><input id="sVendor" type="checkbox" /> 对照：厂商参数（线框）</label>
        </div>

        <div class="grp">
          <div class="t">视角</div>
          <div class="btns">
            <button data-view="pad">摇杆特写</button>
            <button data-view="head">正对平面</button>
            <button data-view="section">剖面</button>
            <button data-view="iso">斜视</button>
            <button data-view="full">全身</button>
          </div>
          <div class="row" style="margin-top:8px"><label>画面旋转</label><output id="oRoll">0°</output></div>
          <input id="roll" type="range" min="-180" max="180" step="1" value="0" />
          <div class="hint" style="margin-top:2px">解锁相机锁定的竖直轴：画面滚转，转盘轴跟着倒</div>
        </div>

        <div id="readout"></div>
        <div class="hint">左键转 · 右键平移 · 滚轮远近 · WASD 平移 · Q/E 画面旋转 · 双击复位</div>
      </div>
      <div id="view"><div id="hud"></div></div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
